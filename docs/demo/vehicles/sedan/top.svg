<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" version="1.1"
viewBox="0 0 13581.08 4403.06"
preserveAspectRatio="xMidYMid meet"
style="shape-rendering:geometricPrecision; text-rendering:geometricPrecision; image-rendering:optimizeQuality; fill-rule:evenodd; clip-rule:evenodd"
xmlns:xlink="http://www.w3.org/1999/xlink">
 <defs>
  <style type="text/css"><![CDATA[
    .car-body { fill:none; stroke:#1F5AAD; stroke-width:1.5; vector-effect:non-scaling-stroke; stroke-miterlimit:10; }
    .glass-window { fill:#C8DBED; stroke:#1F5AAD; stroke-width:1.5; vector-effect:non-scaling-stroke; stroke-miterlimit:10; cursor:pointer; transition:fill 180ms ease; pointer-events:all; }
    .glass-window:hover { fill:#B8E5B5; }
    .glass-window.has-damage { fill:#B8E5B5; }
    .glass-window.selected { fill:#B8E5B5; }
    /* The second-panel overlay — shown only when the customer picks
       "Dual / Panoramic" as the sunroof type. Non-interactive (the click
       still belongs to the underlying sunroof_glass rect). */
    .sunroof-divider {
      fill: rgba(31, 90, 173, 0.06);
      stroke: #1F5AAD;
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
      stroke-miterlimit: 10;
      pointer-events: none;
      display: none;
    }
    .sunroof-divider.show { display: block; }
  ]]></style>
 </defs>
 <g id="Layer_x0020_1">
  <!-- Side mirrors (visible from top, protruding from the body) -->
  <path class="car-body" d="M2262.44 8.11l698.25 0c130.29,0 236.86,106.64 236.86,236.86l0 27.7 -1171.97 0 0 -27.7c0,-130.29 106.58,-236.86 236.86,-236.86z"/>

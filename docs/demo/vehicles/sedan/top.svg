  <path class="car-body" d="M2262.44 4394.95l698.25 0c130.29,0 236.86,-106.64 236.86,-236.86l0 -27.7 -1171.97 0 0 27.7c0,130.29 106.58,236.86 236.86,236.86z"/>
  <path class="car-body" d="M10788.63 4394.95l698.25 0c130.29,0 236.86,-106.64 236.86,-236.86l0 -27.7 -1171.97 0 0 27.7c0,130.29 106.58,236.86 236.86,236.86z"/>

  <!-- Body silhouette (top view) -->
  <path class="car-body" d="M13572.97 1994.25l0 413.8c-97.6,1284.29 -446.51,1787.79 -1319.98,1709.94l-2042.71 1.38 -136.23 209.73c-85.9,98.8 -154.42,76 -215.32,0l82.04 -209.51 -9078.13 3.7c-826.15,-65.47 -838.04,-477.03 -853.17,-1227.7l1.01 -1432.7c-22.44,-824.78 104.35,-1106.96 837.43,-1190.21l9088.65 0 -77.82 -198.72c60.91,-76 129.43,-98.8 215.32,0l129.08 198.72 2036.94 0c1024.17,-72.71 1257.09,604.53 1332.9,1721.58z"/>

  <!-- Sunroof — single clickable rect (the big rounded rectangle). -->
  <rect id="sunroof_glass" class="glass-window" data-glass-name="Sunroof Glass" role="button" tabindex="0" aria-label="Sunroof Glass" x="2848.68" y="935.3" width="6678.17" height="2532.45" rx="228.87" ry="236.86"><title>Sunroof Glass</title></rect>

  <!-- Second-panel overlay (hidden by default). JS adds the .show class
       when sunroof_type === "dual" to indicate a panoramic / split sunroof. -->
  <path id="sunroof_dual_divider" class="sunroof-divider" d="M3085.55 935.3l3065.75 0c130.29,0 236.86,106.61 236.86,236.86l0 2058.73c0,130.25 -106.61,236.86 -236.86,236.86l-3065.75 0c-130.25,0 -236.86,-106.58 -236.86,-236.86l0 -2058.73c0,-130.29 106.58,-236.86 236.86,-236.86z"/>
 </g>
